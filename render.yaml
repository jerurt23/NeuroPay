# Servidor de Gmail en Render (plan gratis, sin tarjeta).
# Las cuentas se guardan en MongoDB Atlas, así que el disco efímero no importa.
# Los valores marcados con sync: false se piden en el panel de Render y NO van aquí.
services:
  - type: web
    name: neuropay-gmail
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://neuropay-2fc4d.web.app,https://neuropay-2fc4d.firebaseapp.com,http://localhost:3000
      - key: FIREBASE_PROJECT_ID
        value: neuropay-2fc4d
      - key: FIREBASE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GMAIL_ALLOWED_EMAILS
        sync: false
